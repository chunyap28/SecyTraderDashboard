<!doctype html><html><head><meta charset='utf-8'><title>Trading Dashboard</title><style>
:root {
  --page-bg: #f9f9f7;
  --surface: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --border: rgba(11,11,11,0.10);
  --gridline: #e1e0d9;
  --accent: #2a78d6;
  --good: #0ca30c;
  --critical: #d03b3b;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page-bg: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
    --accent: #3987e5;
    --good: #0ca30c;
    --critical: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  max-width: 1100px;
  margin-inline: auto;
  background: var(--page-bg);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.subtitle { color: var(--text-secondary); margin: 0 0 16px; font-size: 0.9rem; }
.back-link { display: inline-block; margin-bottom: 20px; color: var(--text-secondary); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: 0 1px 2px rgba(11,11,11,0.04);
}
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--gridline);
  white-space: nowrap;
}
th {
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.total-row td { font-weight: 700; border-top: 2px solid var(--gridline); border-bottom: none; }
tr:last-child td { border-bottom: none; }
tr.history-row td {
  white-space: normal;
  background: var(--page-bg);
  font-size: 0.78rem;
  color: var(--text-secondary);
  padding: 4px 10px 8px 30px;
}
.history-label { font-weight: 600; color: var(--text-muted); }
tr.trade-row { cursor: pointer; }
tr.trade-row:hover td { background: rgba(42,120,214,0.08); }
tr.trade-row.selected td { background: rgba(42,120,214,0.15); }
.pnl-pos { color: var(--good); }
.pnl-neg { color: var(--critical); }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-long { background: rgba(42,120,214,0.15); color: var(--accent); }
.badge-short { background: rgba(208,59,59,0.15); color: var(--critical); }
.muted { color: var(--text-muted); }
.stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  min-width: 120px;
  flex: 1 1 120px;
  box-shadow: 0 1px 2px rgba(11,11,11,0.04);
}
.stat-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  margin-bottom: 4px;
}
.stat-value { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart-block { width: 100%; }
.log-panel {
  max-height: 400px;
  overflow-y: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.82rem;
  line-height: 1.5;
}
</style></head><body><h1>Trading Dashboard</h1></body></html>
